name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend runtime
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Exercise the shipped plugin in React
        run: npm test

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --locked --extra test --python ${{ matrix.python-version }}

      - name: Check Python style
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Validate manifests
        run: |
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          manifest = json.loads(Path("dashboard/manifest.json").read_text(encoding="utf-8"))
          plugin = yaml.safe_load(Path("plugin.yaml").read_text(encoding="utf-8"))
          assert manifest["name"] == plugin["name"]
          assert manifest["version"] == plugin["version"]
          assert Path("dashboard", manifest["entry"]).is_file()
          if manifest.get("css"):
              assert Path("dashboard", manifest["css"]).is_file()
          PY

      - name: Compile Python
        run: uv run --locked python -m compileall -q __init__.py dashboard tests

      - name: Run pytest
        run: uv run --locked pytest -q

      - name: Build and inspect package
        run: |
          rm -rf dist
          uv build
          uv run --locked python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          required = {
              "plugin.yaml",
              "__init__.py",
              "dashboard/manifest.json",
              "dashboard/dist/index.js",
              "dashboard/dist/style.css",
          }
          missing = required - names
          assert not missing, f"wheel is missing: {sorted(missing)}"
          PY
