name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade fastapi pydantic pyyaml

      - name: Validate manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          json.loads(Path("dashboard/manifest.json").read_text(encoding="utf-8"))
          import yaml
          yaml.safe_load(Path("plugin.yaml").read_text(encoding="utf-8"))
          PY

      - name: Compile Python
        run: python -m compileall -q __init__.py dashboard tests

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
