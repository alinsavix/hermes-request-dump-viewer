[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "hermes-request-dump-viewer"
version = "0.4.4"
description = "Hermes Agent dashboard plugin for inspecting request dumps"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "TDV Alinsa" }]
dependencies = [
    "fastapi>=0.104,<1",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1,<10",
    "pyyaml>=6.0,<7",
    "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
only-include = ["plugin.yaml", "__init__.py", "dashboard", "tests", "README.md", "LICENSE"]

[tool.hatch.build.targets.sdist]
include = ["plugin.yaml", "__init__.py", "dashboard", "tests", "README.md", "LICENSE", "pyproject.toml", "uv.lock", "package.json", "package-lock.json"]

[tool.ruff]
target-version = "py311"
line-length = 132
extend-exclude = ["dashboard/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
